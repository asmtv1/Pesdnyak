name: pesdnyak

services:
  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE is required}:${BOT_IMAGE_TAG:?BOT_IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - path: ${BOT_ENV_FILE:?BOT_ENV_FILE is required}
        required: true
    volumes:
      - type: bind
        source: ${BOT_DATA_DIR:?BOT_DATA_DIR is required}
        target: /app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from pathlib import Path; assert Path('/tmp/pesdnyak-ready').is_file(); assert b'dog-excuses' in Path('/proc/1/cmdline').read_bytes()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

