[project]
name = "dog-excuses-bot"
version = "0.1.0"
description = "Telegram bot generating dog-related excuses"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
dog-excuses = "dog_excuses.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dog_excuses"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dog_excuses"]
